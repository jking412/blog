name: Check, build, and deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Verify article metadata and links
        run: npm run verify:content
      - name: Build static site
        run: npm run build
      - name: Deploy to external astro branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo '::notice::Build passed. Deployment skipped: configure PAGES_DEPLOY_TOKEN to enable cross-repository publishing.'
          else
            node scripts/deploy.mjs
          fi
